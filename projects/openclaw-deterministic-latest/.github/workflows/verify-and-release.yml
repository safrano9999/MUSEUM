# Source of truth: SCRIPTS/githubactions. Generated copies are overwritten.
name: openclaw-deterministic-latest build_asset

on:
  push:
    tags:
      - "20*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out patch source
        uses: actions/checkout@v4

      - name: Load exact pins
        id: pins
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source build.conf
          set +a
          [[ "$OPENCLAW_VERSION" =~ ^[0-9]{4}[.][0-9]+[.][0-9]+([-][A-Za-z0-9.]+)?$ ]]
          [[ "$OPENCLAW_IMAGE" =~ ^(docker[.]io|ghcr[.]io)/openclaw/openclaw:[A-Za-z0-9._-]+(@sha256:[0-9a-f]{64})?$ ]]
          [[ "$OPENCLAW_UPSTREAM_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$OPENCLAW_PATCH_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$OPENCLAW_PATCH_FILE" == "patches/openclaw-${OPENCLAW_VERSION}-deterministic.patch" ]]
          release_prefix="${OPENCLAW_VERSION}-deterministic."
          [[ "$OPENCLAW_DETERMINISTIC_RELEASE_TAG" == "$release_prefix"* ]]
          [[ "${OPENCLAW_DETERMINISTIC_RELEASE_TAG#"$release_prefix"}" =~ ^[0-9]+$ ]]
          [[ "$OPENCLAW_DETERMINISTIC_ASSET" == "openclaw-${OPENCLAW_VERSION}-deterministic.tar.gz" ]]
          [[ "$OPENCLAW_PNPM_VERSION" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]
          [[ "$OPENCLAW_NODE_VERSION" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]
          test -s "$OPENCLAW_PATCH_FILE"
          actual_patch_sha="$(sha256sum "$OPENCLAW_PATCH_FILE" | cut -d' ' -f1)"
          test "$actual_patch_sha" = "$OPENCLAW_PATCH_SHA256"
          {
            printf 'version=%s\n' "$OPENCLAW_VERSION"
            printf 'image=%s\n' "$OPENCLAW_IMAGE"
            printf 'upstream_sha=%s\n' "$OPENCLAW_UPSTREAM_SHA"
            printf 'patch=%s\n' "$OPENCLAW_PATCH_FILE"
            printf 'release_tag=%s\n' "$OPENCLAW_DETERMINISTIC_RELEASE_TAG"
            printf 'asset=%s\n' "$OPENCLAW_DETERMINISTIC_ASSET"
            printf 'pnpm_version=%s\n' "$OPENCLAW_PNPM_VERSION"
            printf 'node_version=%s\n' "$OPENCLAW_NODE_VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Check out pinned OpenClaw source
        uses: actions/checkout@v4
        with:
          repository: openclaw/openclaw
          ref: ${{ steps.pins.outputs.upstream_sha }}
          fetch-depth: 1
          path: upstream

      - name: Verify pin and apply patch
        shell: bash
        run: ./scripts/apply-pinned-patch.sh upstream

      - name: Set up exact pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.pins.outputs.pnpm_version }}
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.pins.outputs.node_version }}
          cache: pnpm
          cache-dependency-path: upstream/pnpm-lock.yaml

      - name: Install exact dependencies
        working-directory: upstream
        run: pnpm install --frozen-lockfile

      - name: Run deterministic contract tests
        working-directory: upstream
        run: |
          pnpm exec vitest run \
            src/agents/deterministic-gateway-model.test.ts \
            src/plugins/before-agent-reply.test.ts \
            src/auto-reply/reply/agent-runner-utils.deterministic.test.ts

      - name: Build OpenClaw
        working-directory: upstream
        run: pnpm build

      - name: Package release assets
        shell: bash
        env:
          PATCH_FILE: ${{ steps.pins.outputs.patch }}
        run: |
          set -euo pipefail
          ./scripts/package-dist.sh upstream artifacts
          patch_asset="$(basename -- "$PATCH_FILE")"
          cp -- "$PATCH_FILE" "artifacts/$patch_asset"
          (
            cd artifacts
            sha256sum "$patch_asset" > "$patch_asset.sha256"
          )

      - name: Publish version-pinned release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/20')
        env:
          GH_TOKEN: ${{ github.token }}
          OPENCLAW_VERSION: ${{ steps.pins.outputs.version }}
          OPENCLAW_IMAGE: ${{ steps.pins.outputs.image }}
          OPENCLAW_UPSTREAM_SHA: ${{ steps.pins.outputs.upstream_sha }}
          RELEASE_TAG: ${{ steps.pins.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          title="OpenClaw ${OPENCLAW_VERSION} deterministic patch"
          notes="Exact upstream: ${OPENCLAW_UPSTREAM_SHA}. Runtime image: ${OPENCLAW_IMAGE}."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" artifacts/* --clobber
            gh release edit "$tag" --title "$title" --notes "$notes" --latest=false
          else
            gh release create "$tag" artifacts/* \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "$notes" \
              --latest=false
          fi

      - name: Publish latest release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/20')
        env:
          GH_TOKEN: ${{ github.token }}
          OPENCLAW_VERSION: ${{ steps.pins.outputs.version }}
          OPENCLAW_IMAGE: ${{ steps.pins.outputs.image }}
          OPENCLAW_UPSTREAM_SHA: ${{ steps.pins.outputs.upstream_sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag=latest
          notes="Latest OpenClaw ${OPENCLAW_VERSION} deterministic assets from ${OPENCLAW_UPSTREAM_SHA}. Runtime image: ${OPENCLAW_IMAGE}. Current source tag: ${GITHUB_REF_NAME}."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" artifacts/* --clobber
            gh release edit "$tag" --title "$tag" --notes "$notes" --latest
          else
            gh release create "$tag" artifacts/* \
              --verify-tag \
              --title "$tag" \
              --notes "$notes" \
              --latest
          fi
