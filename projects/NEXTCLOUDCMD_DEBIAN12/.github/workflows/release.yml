name: Build Debian 12 bundle

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - BUNDLE_REVISION
      - Containerfile
      - scripts/**
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: meta
        run: echo "revision=$(<BUNDLE_REVISION)" >> "$GITHUB_OUTPUT"
      - name: Build and export tested bundle
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          target: artifact
          outputs: type=local,dest=dist
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify artifact
        run: |
          unzip -t dist/nextcloudcmd-debian12-x86_64.zip
          (cd dist && sha256sum -c nextcloudcmd-debian12-x86_64.zip.sha256)
          du -h dist/*
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ steps.meta.outputs.revision }}
        run: |
          tag="debian12.${REVISION}"
          gh release delete "$tag" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$tag" dist/* \
            --title "nextcloudcmd for Debian 12" \
            --notes "Headless nextcloudcmd from Debian 12, dynamically bundled and smoke-tested on Debian 12." \
            --latest
