schema_version = 1

[build]
base_image = "quay.io/fedora/fedora:43"
base_requirements = [
  "supervisor",
  "python3",
  "python3-pip",
  "curl",
  "openssl",
  "iproute",
  "procps-ng",
]

[naming]
adjectives = [
  "brisk",
  "calm",
  "clever",
  "fuzzy",
  "lively",
  "nimble",
  "quiet",
  "rapid",
  "steady",
  "witty"
]
animals = [
  "otter",
  "lynx",
  "falcon",
  "badger",
  "fox",
  "wolf",
  "panda",
  "raven",
  "stoat",
  "tiger"
]

[configure]
container_prefix = "citadel-"
image_registry = "localhost"
network = "host"
include_thirdparty = true

[modules]
exclude = "3RDPARTY_DEPENDENCIES"

[volumes]
paths = ["/etc/supervisor/conf.d"]
