schema_version = 1

[env]
entries = [
  { key = "HOST", default = "0.0.0.0", description = "Bind host" },
  { key = "DB_HOST", default = "127.0.0.1", description = "MariaDB host" },
  { key = "DB_PORT", default = "3306", description = "MariaDB port" },
  { key = "DB_NAME", default = "NaturalGrounding-Tiktok-Ying-Video-Manager", description = "MariaDB database name" },
  { key = "DB_USER", default = "NaturalGrounding-Tiktok-Ying-Video-Manager", description = "MariaDB username" },
  { key = "DB_PW", default = "", description = "MariaDB password", required = true },
  { key = "NG_CONFIG_FILE", default = "/opt/NaturalGrounding-Tiktok-Ying-Video-Manager/config/db_config.env", description = "Optional legacy DB config file path" },
  { key = "VIDEOS_DIR", default = "/opt/NaturalGrounding-Tiktok-Ying-Video-Manager/VIDEOS", description = "Video storage directory" },
]
