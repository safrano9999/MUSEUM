schema_version = 1
schema_name = "litellm"
schema_scope = "global"
schema_order = 50

[[fields]]
key = "LITELLM_MODE"
type = "choice"
choices = ["sdk", "proxy"]
default = "proxy"
label = "LiteLLM backend"
help = "SDK = lokaler Proxy, Proxy = externer Endpunkt"
required = true
scope = "global"
group = "litellm"
order = 1
triggered_by = ["napoleon", "jugo", "pvdach", "litellm"]

[[fields]]
key = "LITELLM_LOCAL_PORT"
type = "port"
default = 4000
label = "LiteLLM Local Port"
scope = "global"
group = "litellm"
order = 2
triggered_by = ["napoleon", "jugo", "pvdach", "litellm"]
when = { key = "LITELLM_MODE", eq = "sdk" }

[[fields]]
key = "OPENAI_API_BASE"
type = "str"
default = "http://127.0.0.1:4000/v1"
label = "OPENAI_API_BASE (LiteLLM URL)"
help = "URL zum LiteLLM Proxy"
required = true
scope = "global"
group = "litellm"
order = 3
triggered_by = ["napoleon", "jugo", "pvdach", "litellm"]
when = { key = "LITELLM_MODE", eq = "proxy" }

[[fields]]
key = "OPENAI_API_KEY"
type = "str"
default = ""
label = "OpenAI API Key"
help = "Proxy bearer key"
scope = "global"
group = "litellm"
order = 4
triggered_by = ["napoleon", "jugo", "pvdach", "litellm"]
when = { key = "LITELLM_MODE", eq = "proxy" }
retry_on_no = 3
retry_prompt = "API Key wird fuer externe Modelle benoetigt. Wirklich ohne?"

[[fields]]
key = "DEFAULT_MODEL"
type = "str"
default = "openai/gpt-5.4"
label = "Default Model"
help = "Unified default model"
scope = "global"
group = "litellm"
order = 5
triggered_by = ["napoleon", "jugo", "pvdach", "litellm"]

