schema_version = 1

[litellm]
modules = ["napoleon", "jugo", "pvdach"]
default_mode = "external"
external_base_url = "http://127.0.0.1:4000/v1"
local_port = 4000
default_model = "openai/gpt-5.4"
model_candidates = [
  "openai/gpt-5.4",
  "anthropic/claude-sonnet-4",
  "google/gemini-2.5-pro",
  "xai/grok-4",
  "openrouter/openai/gpt-5",
  "ollama/qwen3:latest"
]

[litellm.dependency_models]
napoleon = ["anthropic/claude-sonnet-4", "openai/gpt-5.4"]
pvdach = ["openai/gpt-5.4", "google/gemini-2.5-pro"]
jugo = ["openai/gpt-5.4", "google/gemini-2.5-pro"]
