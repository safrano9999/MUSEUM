# clawbridge.conf — deployment path configuration
#
# No credentials here. Credentials go in telegram_actions/.botenv
# All values are optional. Defaults use paths relative to clawbridge_tg.sh.
# Uncomment and set only what differs from the defaults.

# Absolute path to the TRIGGERDIR directory.
# Default: <clawbridge_dir>/TRIGGERDIR
TRIGGERDIR=/srv/TRIGGERDIR

# Absolute path where sibling plugin projects are discovered (../*/openclaw_plugin.json).
# Default: parent directory of CLAWBRIDGE
#PROJECTS_DIR=/home/user/github

# Absolute path for log files.
# Default: <clawbridge_dir>/logs
#LOG_DIR=/home/user/github/CLAWBRIDGE/logs
