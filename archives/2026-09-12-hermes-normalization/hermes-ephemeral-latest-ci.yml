# Source of truth: SCRIPTS/githubactions. Generated copies are overwritten.
name: Runtime tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hermes-ephemeral-latest-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Test runtime configuration
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check PyYAML
          PYTHONDONTWRITEBYTECODE=1 \
          PYTHONPATH=image/runtime/usr/local/lib/hermes-ephemeral \
            python3 -m unittest discover -s tests -v
